{% extends "registration/base.html" %}
{% block content %}
{% if validlink %}<h2>Choose a new password</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Reset password</button></form>
{% else %}<h2>This link is invalid or expired</h2><p>Return to LeaseGuard and request a new reset email.</p>{% endif %}
{% endblock %}
