name: Mobile Builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Android debug app
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

  ios:
    name: iOS Build
    runs-on: xcode-27
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUNDLE_FROZEN: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          working-directory: frontend
          bundler-cache: true

      - name: Install CocoaPods dependencies
        working-directory: frontend/ios
        run: bundle exec pod install --deployment

      - name: Build iOS Simulator app
        working-directory: frontend/ios
        run: >-
          xcodebuild
          -workspace frontend.xcworkspace
          -scheme frontend
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/leaseguard-ios-build"
          CODE_SIGNING_ALLOWED=NO
          build
