name: AI Live Evaluation (trusted/manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ephemeral-evaluation-only
      MONGODB_URI: mongodb://127.0.0.1:27017/
      MONGODB_DB_NAME: leaseguard_ci
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout reviewed main only
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require a private API key
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Configure the GEMINI_API_KEY repository secret."
            exit 1
          fi
      - name: Run opt-in 19-case live evaluation (maximum 38 requests, no retry)
        run: python manage.py run_ai_evals --live
